<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Gradient definitions to match the site's Purple & Blue branding -->
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" /> <!-- tailwind purple-500 -->
      <stop offset="100%" stop-color="#60a5fa" /> <!-- tailwind blue-400 -->
    </linearGradient>
    <linearGradient id="brainGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" /> <!-- tailwind fuchsia-400 -->
      <stop offset="100%" stop-color="#3b82f6" /> <!-- tailwind blue-500 -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Film Border Container -->
  <rect x="15" y="15" width="70" height="70" rx="18" fill="url(#brandGrad)" />
  
  <!-- Film Strip Sprocket Holes (Left) -->
  <circle cx="26" cy="28" r="4.5" fill="#0a0a0a" />
  <circle cx="26" cy="50" r="4.5" fill="#0a0a0a" />
  <circle cx="26" cy="72" r="4.5" fill="#0a0a0a" />
  
  <!-- Film Strip Sprocket Holes (Right) -->
  <circle cx="74" cy="28" r="4.5" fill="#0a0a0a" />
  <circle cx="74" cy="50" r="4.5" fill="#0a0a0a" />
  <circle cx="74" cy="72" r="4.5" fill="#0a0a0a" />

  <!-- Inner Screen Cutout -->
  <rect x="36" y="24" width="28" height="52" rx="6" fill="#0a0a0a" />

  <!-- AI Sparkle/Star in the middle of the screen -->
  <path 
    d="M50 35 C50 45, 41 50, 41 50 C50 50, 50 55, 50 65 C50 55, 59 50, 59 50 C50 50, 50 45, 50 35 Z" 
    fill="url(#brainGrad)" 
    filter="url(#glow)"
  />
</svg>
